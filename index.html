<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小鬼跳跃 (Ghost Jump)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #1a202c;
            color: #e2e8f0;
            overflow: hidden; /* 防止滚动条出现 */
        }
        /* 自定义焦点样式，使其更醒目 */
        .btn-focus-visible:focus-visible {
            outline: 4px dashed #4a5568;
            outline-offset: 4px;
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen">

    <div class="w-full max-w-4xl mx-auto p-4 relative">
        <!-- 游戏分数显示 -->
        <div id="score-container" class="absolute top-4 left-4 text-lg md:text-2xl z-20 hidden">
            <span>分数: <span id="current-score">0</span></span>
            <span class="ml-4">最高: <span id="high-score">0</span></span>
        </div>
        
        <!-- 静音按钮 -->
        <div class="absolute top-4 right-4 z-20">
             <button id="mute-button" class="w-10 h-10 md:w-12 md:h-12 bg-gray-700 rounded-full flex items-center justify-center text-white text-xl shadow-lg btn-focus-visible">
                🎵
            </button>
        </div>

        <!-- 游戏画布 -->
        <canvas id="gameCanvas" class="w-full h-auto bg-gray-800 rounded-lg shadow-2xl"></canvas>

        <!-- 游戏开始菜单 -->
        <div id="start-menu" class="absolute inset-0 bg-black bg-opacity-70 flex flex-col items-center justify-center rounded-lg z-30">
            <h1 class="text-4xl md:text-6xl text-white mb-4">小鬼跳跃</h1>
            <p class="text-xl md:text-2xl text-gray-300 mb-8">历史最高分: <span id="start-high-score">0</span></p>
            <button id="start-button" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-8 rounded-lg text-2xl shadow-lg transform hover:scale-105 transition-transform duration-200 btn-focus-visible">
                开始游戏
            </button>
            <p class="text-gray-400 mt-8 text-sm">按 [空格] 或 [点击屏幕] 跳跃</p>
        </div>

        <!-- 游戏结束菜单 -->
        <div id="game-over-menu" class="absolute inset-0 bg-black bg-opacity-70 flex-col items-center justify-center rounded-lg z-30 hidden">
            <h2 class="text-5xl md:text-7xl text-red-500 mb-4">游戏结束</h2>
            <p id="new-high-score-notify" class="text-2xl text-yellow-400 mb-4 hidden">新纪录!</p>
            <p class="text-xl md:text-2xl text-gray-300 mb-2">你的分数: <span id="final-score">0</span></p>
            <p class="text-xl md:text-2xl text-gray-300 mb-8">历史最高分: <span id="end-high-score">0</span></p>
            <button id="restart-button" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-8 rounded-lg text-2xl shadow-lg transform hover:scale-105 transition-transform duration-200 btn-focus-visible">
                重新开始
            </button>
        </div>
    </div>

    <script>
        // --- DOM 元素获取 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreContainer = document.getElementById('score-container');
        const currentScoreEl = document.getElementById('current-score');
        const highScoreEl = document.getElementById('high-score');

        const startMenu = document.getElementById('start-menu');
        const startHighScoreEl = document.getElementById('start-high-score');
        const startButton = document.getElementById('start-button');

        const muteButton = document.getElementById('mute-button');

        const gameOverMenu = document.getElementById('game-over-menu');
        const finalScoreEl = document.getElementById('final-score');
        const endHighScoreEl = document.getElementById('end-high-score');
        const restartButton = document.getElementById('restart-button');
        const newHighScoreNotify = document.getElementById('new-high-score-notify');

        // --- 游戏常量和变量 ---
        const GRAVITY = 0.5;
        const JUMP_STRENGTH = -14; // 增加跳跃高度
        const HIGH_SCORE_KEY = 'ghostJumpHighScore';

        let canvasWidth, canvasHeight;
        let player, obstacles, particles, score, highScore, gameSpeed, frameCount;
        let gameState = 'pre-game'; // 'pre-game', 'playing', 'game-over'
        let animationFrameId;

        // --- 音频变量 ---
        let music;
        let audioStarted = false;
        let isMuted = false;

        // --- 粒子效果对象 ---
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 5 + 3;
                this.speedY = (Math.random() * 2) - 1;
                this.speedX = (Math.random() * 2) - 1;
                this.alpha = 1;
            }
        
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= 0.05;
            }
        
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // --- 玩家 (小鬼) 对象 ---
        class Player {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.baseY = y;
                this.width = width;
                this.height = height;
                this.velocityY = 0;
                this.isGrounded = true;
                this.jumpCount = 0; // 为连跳增加计数器
            }

            draw() {
                ctx.fillStyle = 'white';
                ctx.beginPath();
                // 头部
                ctx.arc(this.x + this.width / 2, this.y + this.height / 2, this.width / 2, Math.PI, 0);
                // 身体底部波浪线
                ctx.lineTo(this.x + this.width, this.y + this.height);
                ctx.quadraticCurveTo(this.x + this.width * 0.75, this.y + this.height * 0.8, this.x + this.width / 2, this.y + this.height);
                ctx.quadraticCurveTo(this.x + this.width * 0.25, this.y + this.height * 0.8, this.x, this.y + this.height);
                ctx.closePath();
                ctx.fill();

                // 眼睛
                ctx.fillStyle = 'black';
                const eyeRadius = this.width / 10;
                ctx.beginPath();
                ctx.arc(this.x + this.width * 0.35, this.y + this.height * 0.4, eyeRadius, 0, Math.PI * 2);
                ctx.arc(this.x + this.width * 0.65, this.y + this.height * 0.4, eyeRadius, 0, Math.PI * 2);
                ctx.fill();
            }

            update() {
                if (!this.isGrounded) {
                    this.velocityY += GRAVITY;
                    this.y += this.velocityY;
                }

                // 确保不掉下地面
                if (this.y + this.height >= canvasHeight - 20) {
                    this.y = canvasHeight - this.height - 20;
                    this.velocityY = 0;
                    this.isGrounded = true;
                    this.jumpCount = 0; // 落地后重置跳跃计数
                }
            }

            jump() {
                if (this.jumpCount < 2) { // 最多允许连跳两次
                    this.velocityY = JUMP_STRENGTH;
                    this.isGrounded = false;
                    this.jumpCount++;
                    spawnJumpParticles(); // 生成跳跃粒子
                }
            }
        }

        // --- 障碍物对象 ---
        class Obstacle {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
            }

            draw() {
                ctx.fillStyle = '#718096'; // gray-500
                ctx.fillRect(this.x, this.y, this.width, this.height);
                // 墓碑顶部装饰
                ctx.fillStyle = '#4A5568'; // gray-700
                ctx.fillRect(this.x - 5, this.y, this.width + 10, 10);
            }

            update() {
                this.x -= gameSpeed;
            }
        }

        // --- 空中障碍物对象 ---
        class FloatingObstacle {
            constructor(x, y, radius) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.width = radius * 2; // 用于碰撞检测
                this.height = radius * 2; // 用于碰撞检测
                this.angle = 0;
            }

            draw() {
                ctx.fillStyle = '#fbd38d'; // orange-200
                ctx.beginPath();
                for (let i = 0; i < 8; i++) {
                    const angle = this.angle + (i * Math.PI / 4);
                    const x1 = this.x + Math.cos(angle) * this.radius;
                    const y1 = this.y + Math.sin(angle) * this.radius;
                    const x2 = this.x + Math.cos(angle + Math.PI / 8) * this.radius * 0.6;
                    const y2 = this.y + Math.sin(angle + Math.PI / 8) * this.radius * 0.6;
                    ctx.lineTo(x1, y1);
                    ctx.lineTo(x2, y2);
                }
                ctx.closePath();
                ctx.fill();
            }

            update() {
                this.x -= gameSpeed;
                this.angle += 0.05;
            }
        }
        
        // --- 游戏初始化 ---
        function init() {
            // 设置画布尺寸
            const container = canvas.parentElement;
            const aspectRatio = 16 / 9;
            canvasWidth = container.clientWidth;
            canvasHeight = canvasWidth / aspectRatio;
            
            // 限制最大高度
            if (canvasHeight > window.innerHeight * 0.8) {
                canvasHeight = window.innerHeight * 0.8;
                canvasWidth = canvasHeight * aspectRatio;
            }
            
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;

            // 初始化游戏变量
            const playerWidth = canvasWidth / 25;
            const playerHeight = playerWidth * 1.2;
            player = new Player(canvasWidth / 6, canvasHeight - playerHeight - 20, playerWidth, playerHeight);
            
            obstacles = [];
            particles = [];
            score = 0;
            highScore = loadHighScore();
            gameSpeed = canvasWidth / 150;
            frameCount = 0;

            updateScoreUI();
            updateHighScoreUI();
        }

        // --- 主游戏循环 ---
        function gameLoop() {
            if (gameState !== 'playing') return;

            // 清理画布
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            
            // 绘制地面
            drawGround();

            // 更新和绘制玩家
            player.update();
            player.draw();

            // 更新和绘制障碍物
            handleObstacles();

            // 更新和绘制粒子效果
            handleParticles();

            // 碰撞检测
            checkCollisions();

            // 更新分数
            score += 0.1;
            updateScoreUI();
            
            // 增加游戏难度
            frameCount++;
            if (frameCount % 300 === 0) {
                gameSpeed += 0.2;
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // --- 辅助函数 ---
        function drawGround() {
            ctx.fillStyle = '#A0AEC0'; // gray-400
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
        }

        function handleParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function spawnJumpParticles() {
            const particleCount = 5;
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle(player.x + player.width / 2, player.y + player.height));
            }
        }

        function handleObstacles() {
            // 每隔一段时间生成新障碍物
            const spawnInterval = Math.max(80 - gameSpeed * 5, 50);
            if (frameCount % Math.round(spawnInterval) === 0) {
                 if (Math.random() > 0.3) {
                    // 随机生成地面或空中障碍物
                    if (Math.random() > 0.4) {
                        const obsHeight = Math.random() * (canvasHeight / 8) + canvasHeight / 12;
                        const obsWidth = obsHeight / 2;
                        obstacles.push(new Obstacle(canvasWidth, canvasHeight - obsHeight - 20, obsWidth, obsHeight));
                    } else {
                        const radius = Math.random() * 15 + 15;
                        const yPos = canvasHeight - (player.height * 2.5) - Math.random() * (canvasHeight / 4);
                        obstacles.push(new FloatingObstacle(canvasWidth, yPos, radius));
                    }
                }
            }

            // 更新和绘制所有障碍物
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                obstacles[i].draw();

                // 移除屏幕外的障碍物
                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function checkCollisions() {
            for (const obstacle of obstacles) {
                // 根据障碍物类型调整碰撞盒
                const obstacleBox = {
                    x: obstacle.constructor.name === 'FloatingObstacle' ? obstacle.x - obstacle.radius : obstacle.x,
                    y: obstacle.constructor.name === 'FloatingObstacle' ? obstacle.y - obstacle.radius : obstacle.y,
                    width: obstacle.width,
                    height: obstacle.height
                };
                const playerBox = { x: player.x, y: player.y, width: player.width, height: player.height };
                
                // AABB 碰撞检测
                if (playerBox.x < obstacleBox.x + obstacleBox.width &&
                    playerBox.x + playerBox.width > obstacleBox.x &&
                    playerBox.y < obstacleBox.y + obstacleBox.height &&
                    playerBox.y + playerBox.height > obstacleBox.y) {
                    endGame();
                    return;
                }
            }
        }

        function createMusic() {
            // 创建一个合成器
            const synth = new Tone.FMSynth({
                modulationIndex: 10,
                envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.8 },
                harmonicity: 3.01
            }).toDestination();

            // 创建一个循环播放的音序
            music = new Tone.Sequence((time, note) => {
                synth.triggerAttackRelease(note, '8n', time);
            }, ['C3', 'Eb3', 'G3', 'Eb3', 'C3', null, 'G2'], '4n').start(0);
            
            Tone.Transport.bpm.value = 100;
        }

        async function startGame() {
            // 首次用户交互时启动音频上下文
            if (!audioStarted) {
                await Tone.start();
                createMusic();
                audioStarted = true;
                console.log('Audio context started');
            }

            if (!isMuted) {
                Tone.Transport.start();
            }

            init();
            gameState = 'playing';
            startMenu.classList.add('hidden');
            gameOverMenu.classList.add('hidden');
            scoreContainer.classList.remove('hidden');
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function endGame() {
            gameState = 'game-over';
            cancelAnimationFrame(animationFrameId);
            
            if (audioStarted) {
                Tone.Transport.stop();
            }

            scoreContainer.classList.add('hidden');
            gameOverMenu.classList.remove('hidden');
            gameOverMenu.classList.add('flex');

            const finalIntScore = Math.floor(score);
            finalScoreEl.textContent = finalIntScore;
            
            if (finalIntScore > highScore) {
                highScore = finalIntScore;
                saveHighScore(highScore);
                newHighScoreNotify.classList.remove('hidden');
            } else {
                newHighScoreNotify.classList.add('hidden');
            }
            updateHighScoreUI();
        }

        // --- UI 和数据处理 ---
        function updateScoreUI() {
            currentScoreEl.textContent = Math.floor(score);
        }

        function updateHighScoreUI() {
            highScoreEl.textContent = highScore;
            startHighScoreEl.textContent = highScore;
            endHighScoreEl.textContent = highScore;
        }

        function loadHighScore() {
            return parseInt(localStorage.getItem(HIGH_SCORE_KEY)) || 0;
        }

        function saveHighScore(newHighScore) {
            localStorage.setItem(HIGH_SCORE_KEY, newHighScore);
        }

        // --- 事件监听 ---
        function handleJump(e) {
            if (gameState === 'playing') {
                e.preventDefault();
                player.jump();
            } else if (gameState === 'pre-game') {
                startGame();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                handleJump(e);
            }
        });

        // 兼容桌面和移动端点击
        ['mousedown', 'touchstart'].forEach(evt => {
            canvas.addEventListener(evt, handleJump);
        });

        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', startGame);
        
        muteButton.addEventListener('click', () => {
            isMuted = !isMuted;
            Tone.Destination.mute = isMuted;
            muteButton.textContent = isMuted ? '🔇' : '🎵';
        });

        window.addEventListener('resize', init);
        
        // --- 初始加载 ---
        window.onload = () => {
            init();
            startMenu.classList.remove('hidden');
        };
    </script>
</body>
</html>
